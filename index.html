<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Triple Threat Tennis Match Details</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="comparison-periods.css">
</head>
<body>
<main class="app">
  <header class="page-title"><span aria-hidden="true">🎾</span><h1>Match Details</h1></header>
  <div class="toolbar"><label><span>Match</span><select id="match" disabled><option>Loading matchups…</option></select></label><button id="refresh" type="button">Refresh</button></div>
  <p class="status" id="status" role="status">Loading Tennis Match Details…</p>
  <section id="view" hidden>
    <article class="match-card neon-card">
      <div class="player player-a"><div class="portrait" aria-hidden="true">A</div><div><h2 id="a-name"></h2><p id="a-rank"></p><div class="form-line"><b>Last 5:</b><span id="a-form"></span></div><p id="a-record"></p></div><strong class="rest" id="a-rest"></strong></div>
      <div class="versus">VS</div>
      <div class="player player-b"><div class="portrait" aria-hidden="true">B</div><div><h2 id="b-name"></h2><p id="b-rank"></p><div class="form-line"><b>Last 5:</b><span id="b-form"></span></div><p id="b-record"></p></div><strong class="rest" id="b-rest"></strong></div>
      <div class="match-meta" id="meta"></div>
    </article>
    <section class="performance neon-card">
      <div class="section-heading"><h2><span aria-hidden="true">▥</span> Performance Comparison</h2><div class="period-toggle" aria-label="Comparison periods"><button id="season-toggle" type="button" aria-pressed="true">S</button><button id="last5-toggle" type="button" aria-pressed="true">L5</button></div></div>
      <div id="comparison-sections"></div>
    </section>
    <section class="scoring-map neon-card">
      <div class="section-heading map-title"><h2><span aria-hidden="true">▥</span> Matchup Scoring Map <small>Historical Hit Rates (Recent Results)</small></h2></div>
      <div class="map-controls"><div class="map-tabs" id="map-tabs"></div><label class="match-count">Matches: <output id="history-count">10</output><input id="history-slider" type="range" min="5" max="15" value="10"><span>15</span></label><span class="sample-label" id="sample-label">Last 10</span></div>
      <div class="map-scroll"><div id="scoring-grid" class="scoring-grid"></div></div>
    </section>
    <details class="model-analysis neon-card"><summary><span class="model-icon" aria-hidden="true">◇</span><span><b>Model Analysis</b><small>Model opinion, matchup score, and summary. No betting recommendation.</small></span></summary><div id="model-content" class="model-content"></div></details>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Triple Threat Match Overview</title>
<style>
:root{--bg:#071426;--panel:#0d2138;--panel2:#091a2d;--line:#22486f;--line2:#193653;--muted:#8da6c1;--blue:#63a5ff;--a:#f59e0b;--b:#ec4899;--good:#22c55e;--bad:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#16365a 0,var(--bg) 42%);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1280px;margin:auto;padding:22px}.toolbar{display:flex;align-items:end;gap:12px;margin-bottom:16px}.field{flex:1}.field label,.eyebrow,.section-title{display:block;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;margin-bottom:7px}select,button{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:#fff;font:inherit}select{width:100%;padding:11px 13px}button{padding:11px 16px;font-weight:800;cursor:pointer}button:hover{border-color:var(--blue)}.status{font-size:12px;color:var(--muted);margin-bottom:14px}.hero,.card{background:rgba(13,33,56,.94);border:1px solid var(--line);border-radius:15px}.hero{padding:20px;margin-bottom:12px}.players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}.player.right{text-align:right}.role{font-size:10px;color:var(--blue);letter-spacing:1.5px;text-transform:uppercase}.name{font-size:clamp(20px,3vw,34px);font-weight:850;margin:5px 0}.a{color:var(--a)}.b{color:var(--b)}.vs{color:var(--blue);font-size:12px}.form{display:flex;gap:5px;margin-top:10px}.right .form{justify-content:flex-end}.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:850;background:#29435f}.dot.W{background:#108d63}.dot.L{background:#d94747}.meta{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:17px}.prob-block+.prob-block{border-top:1px solid var(--line2);margin-top:18px;padding-top:18px}.prob-values{display:flex;justify-content:space-between;font-size:24px;font-weight:900;margin:8px 0}.bar{height:8px;border-radius:99px;overflow:hidden;display:flex;background:#17324f}.bar .pa{background:var(--a)}.bar .pb{background:var(--b);flex:1}.profile-row,.stat-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2)}.profile-row:last-child,.stat-row:last-child{border:0}.label{font-size:13px}.badge{max-width:65%;font-size:11px;font-weight:750;text-align:right;padding:5px 10px;border:1px solid #315477;border-radius:999px;background:#19334f;color:#c9d7e6}.stats{grid-column:1/-1}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}.pair{font-weight:900;white-space:nowrap}.empty{padding:32px;text-align:center;color:var(--muted)}@media(max-width:720px){.app{padding:12px}.toolbar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr}.players{gap:8px}.name{font-size:19px}.hero{padding:15px}.prob-values{font-size:20px}}
</style>
</head>
<body><main class="app">
  <div class="toolbar"><div class="field"><label for="match">Match</label><select id="match" disabled><option>Loading matches…</option></select></div><button id="refresh" type="button">Refresh</button></div>
  <div class="status" id="status">Connecting to Glide Display Matches…</div>
  <section id="view" hidden>
    <header class="hero"><div class="players"><div class="player"><div class="role">Player A</div><div class="name a" id="a-name"></div><div class="form" id="a-form"></div></div><div class="vs">VS</div><div class="player right"><div class="role">Player B</div><div class="name b" id="b-name"></div><div class="form" id="b-form"></div></div></div><div class="meta" id="meta"></div></header>
    <div class="grid">
      <article class="card"><div class="prob-block"><div class="eyebrow">Model Win Probability</div><div class="prob-values"><span class="a" id="model-a"></span><span class="b" id="model-b"></span></div><div class="bar"><span class="pa" id="model-bar"></span><span class="pb"></span></div></div><div class="prob-block"><div class="eyebrow">No-Vig Win Probability</div><div class="prob-values"><span class="a" id="novig-a"></span><span class="b" id="novig-b"></span></div><div class="bar"><span class="pa" id="novig-bar"></span><span class="pb"></span></div></div></article>
      <article class="card"><div class="section-title">Matchup Profile</div><div id="profiles"></div></article>
      <article class="card stats"><div class="section-title">Control Stats</div><div class="stats-grid" id="stats"></div></article>
    </div>
  </section>
</main>
<script>
const FEED="https://docs.google.com/spreadsheets/d/e/2PACX-1vTUgynZkMlV0EmiCfbuxUoIw6C9_dHoYByxdKwWFnBoUeHUnompM-_FJ4sD_fBfVlX3PcsjhAIQVno4/pub?gid=0&single=true&output=csv";
let rows=[];const $=id=>document.getElementById(id);const clean=s=>String(s??"").trim();
function csv(text){const out=[];let row=[],v="",q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=""}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);v="";if(row.some(Boolean))out.push(row);row=[]}else v+=c}if(v||row.length){row.push(v);out.push(row)}const h=out.shift().map(clean);return out.map(r=>Object.fromEntries(h.map((k,i)=>[k,clean(r[i])])))}
function get(r,...keys){for(const k of keys)if(clean(r[k]))return clean(r[k]);return ""}function n(v){const x=parseFloat(String(v).replace('%',''));return Number.isFinite(x)?(Math.abs(x)<=1.5?x*100:x):null}function pct(v){const x=n(v);return x===null?'—':x.toFixed(1)+'%'}
function dots(id,value){$(id).innerHTML=clean(value).split(/\s+/).filter(Boolean).slice(0,5).map(x=>`<span class="dot ${x==='W'||x==='L'?x:''}">${x}</span>`).join('')}
function modelPair(r){const pick=get(r,'Model Pick','Model Pick ML'),p=n(get(r,'Model ML Probability','Pick Model Probability'));if(p===null)return [null,null];const a=get(r,'fav','Player A'),b=get(r,'dog','Player B');return pick.toLowerCase()===a.toLowerCase()?[p,100-p]:pick.toLowerCase()===b.toLowerCase()?[100-p,p]:[null,null]}
function setProb(prefix,a,b){$(prefix+'-a').textContent=a===null?'—':a.toFixed(1)+'%';$(prefix+'-b').textContent=b===null?'—':b.toFixed(1)+'%';$(prefix+'-bar').style.width=(a===null?50:a)+'%'}
function render(i){const r=rows[i];if(!r)return;const a=get(r,'fav','Player A'),b=get(r,'dog','Player B');$('a-name').textContent=a||'Player A';$('b-name').textContent=b||'Player B';dots('a-form',get(r,'FavLast 5','FavLast5'));dots('b-form',get(r,'doglast 5','DogLast 5'));$('meta').textContent=[get(r,'Tournament'),get(r,'Surface'),get(r,'Round'),get(r,'Date'),get(r,'Time')].filter(Boolean).join(' • ');let [ma,mb]=modelPair(r);setProb('model',ma,mb);setProb('novig',n(get(r,'Fav Win Probability%','Fav Win Probability')),n(get(r,'Dog Win Probability%','Dog Win Probability')));const profiles=[['Surface Edge','SurfaceEdge'],['Base Control','BaseControl'],['Serve Profile','ServeProfile'],['Return Profile','ReturnProfile'],['Chaos Flag','Chaos Flag']];$('profiles').innerHTML=profiles.map(([l,k])=>`<div class="profile-row"><span class="label">${l}</span><span class="badge">${get(r,k)||'—'}</span></div>`).join('');const stats=[['Total Points Won %','favtpw%','dogtpw%'],['Hold %','favhold%','doghold%'],['Break %','favbreak%','dogbreak%'],['Dominance Ratio','favdr','dogdr'],['Second Serve Won %','fav2ndwon%','dog2ndwon%'],['Break Points Saved','Fav BP Saved%','Dog BP Saved%']];$('stats').innerHTML=stats.map(([l,ak,bk])=>`<div class="stat-row"><span class="label">${l}</span><span class="pair"><span class="a">${l==='Dominance Ratio'?(get(r,ak)||'—'):pct(get(r,ak))}</span> / <span class="b">${l==='Dominance Ratio'?(get(r,bk)||'—'):pct(get(r,bk))}</span></span></div>`).join('');$('view').hidden=false}
async function load(){const btn=$('refresh');btn.disabled=true;$('status').textContent='Loading current matches…';try{const res=await fetch(FEED,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);rows=csv(await res.text()).filter(r=>get(r,'MatchID','Match ID'));const sel=$('match');sel.innerHTML=rows.map((r,i)=>`<option value="${i}">${get(r,'Full Match')||get(r,'fav','Player A')+' vs '+get(r,'dog','Player B')}</option>`).join('');sel.disabled=!rows.length;if(rows.length){render(0);$('status').textContent=`${rows.length} current matches • refreshed ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`}else{$('status').textContent='The published sheet has no current matches.'}}catch(e){$('status').textContent='Could not load the published Google Sheet. Confirm the tab is published as CSV, then refresh.';console.error(e)}finally{btn.disabled=false}}
$('match').addEventListener('change',e=>render(Number(e.target.value)));$('refresh').addEventListener('click',load);load();
</script></body></html>

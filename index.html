<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Triple Threat Match Overview</title>

<style>
:root {
  --bg: #071426;
  --panel: #0d2138;
  --panel2: #091a2d;
  --line: #22486f;
  --line2: #193653;
  --muted: #8da6c1;
  --blue: #63a5ff;
  --a: #f59e0b;
  --b: #ec4899;
  --good: #22c55e;
  --bad: #ef4444;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -20%, #16365a 0, var(--bg) 42%);
  color: #fff;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  max-width: 1280px;
  margin: auto;
  padding: 22px;
}

.toolbar {
  display: flex;
  align-items: end;
  gap: 12px;
  margin-bottom: 16px;
}

.field {
  flex: 1;
}

.field label,
.eyebrow,
.section-title {
  display: block;
  color: var(--blue);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.7px;
  text-transform: uppercase;
  margin-bottom: 7px;
}

select,
button {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  color: #fff;
  font: inherit;
}

select {
  width: 100%;
  padding: 11px 13px;
}

button {
  padding: 11px 16px;
  font-weight: 800;
  cursor: pointer;
}

button:hover {
  border-color: var(--blue);
}

.status {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 14px;
}

.hero,
.card {
  background: rgba(13, 33, 56, 0.94);
  border: 1px solid var(--line);
  border-radius: 15px;
}

.hero {
  padding: 20px;
  margin-bottom: 12px;
}

.players {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 18px;
}

.player.right {
  text-align: right;
}

.role {
  font-size: 10px;
  color: var(--blue);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.name {
  font-size: clamp(20px, 3vw, 34px);
  font-weight: 850;
  margin: 5px 0;
}

.a {
  color: var(--a);
}

.b {
  color: var(--b);
}

.vs {
  color: var(--blue);
  font-size: 12px;
}

.form {
  display: flex;
  gap: 5px;
  margin-top: 10px;
}

.right .form {
  justify-content: flex-end;
}

.dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: 850;
  background: #29435f;
}

.dot.W {
  background: #108d63;
}

.dot.L {
  background: #d94747;
}

.meta {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 16px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.card {
  padding: 17px;
}

.prob-block + .prob-block {
  border-top: 1px solid var(--line2);
  margin-top: 18px;
  padding-top: 18px;
}

.prob-values {
  display: flex;
  justify-content: space-between;
  font-size: 24px;
  font-weight: 900;
  margin: 8px 0;
}

.bar {
  height: 8px;
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  background: #17324f;
}

.bar .pa {
  background: var(--a);
}

.bar .pb {
  background: var(--b);
  flex: 1;
}

/* Workbook odds section */
.odds-block {
  border-top: 1px solid var(--line2);
  margin-top: 18px;
  padding-top: 18px;
}

.odds-row {
  display: grid;
  grid-template-columns: 80px minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line2);
}

.odds-row:last-child {
  border-bottom: 0;
}

.odds-market {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.7px;
}

.odds-side {
  min-width: 0;
  font-size: 12px;
  font-weight: 800;
}

.odds-side.right {
  text-align: right;
}

.odds-name {
  display: block;
  color: var(--muted);
  font-size: 9px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.profile-row,
.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line2);
}

.profile-row:last-child,
.stat-row:last-child {
  border: 0;
}

.label {
  font-size: 13px;
}

.badge {
  max-width: 65%;
  font-size: 11px;
  font-weight: 750;
  text-align: right;
  padding: 5px 10px;
  border: 1px solid #315477;
  border-radius: 999px;
  background: #19334f;
  color: #c9d7e6;
}

.stats {
  grid-column: 1 / -1;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 28px;
}

.pair {
  font-weight: 900;
  white-space: nowrap;
}

.empty {
  padding: 32px;
  text-align: center;
  color: var(--muted);
}

@media (max-width: 720px) {
  .app {
    padding: 12px;
  }

  .toolbar {
    align-items: stretch;
    flex-direction: column;
  }

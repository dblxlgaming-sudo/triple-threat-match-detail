<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triple Threat Basketball Match Details</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="comparison-periods.css"><link rel="stylesheet" href="basketball.css"></head><body><main class="app basketball-app"><header class="basketball-title"><h1 id="page-title">Basketball Match Details</h1><strong>TT <small>Triple Threat</small></strong></header><div class="toolbar"><label><span>Match</span><select id="match" disabled><option>Loading matchups…</option></select></label><button id="refresh">Refresh</button></div><p class="status" id="status"></p><section id="view" hidden><article class="match-card neon-card"><div class="player"><div class="team-logo" id="a-logo">A</div><div><h2 id="a-name"></h2><p id="a-record"></p><div class="form-line"><b>Last 5:</b><span id="a-form"></span></div><p id="a-splits"></p></div></div><div class="versus">VS</div><div class="player"><div class="team-logo" id="b-logo">B</div><div><h2 id="b-name"></h2><p id="b-record"></p><div class="form-line"><b>Last 5:</b><span id="b-form"></span></div><p id="b-splits"></p></div></div><div class="match-meta" id="meta"></div></article><div class="basketball-toggle period-toggle"><button id="season-toggle" aria-pressed="false">S</button><button id="last5-toggle" aria-pressed="true">L5</button></div><section id="basketball-comparisons"></section><section class="scoring-map neon-card"><div class="section-heading map-title"><h2>▥ Matchup Scoring Map <small>Historical Results (Team Totals)</small></h2></div><div class="map-controls"><div class="map-tabs" id="map-tabs"></div><label class="match-count">Matches: <output id="history-count">10</output><input id="history-slider" type="range" min="5" max="15" value="10"><span>15</span></label><span class="sample-label" id="sample-label">Last 10</span></div><div class="map-scroll"><div id="scoring-grid" class="scoring-grid"></div></div><p class="map-note">Historical cells remain neutral until approved scoring-map color boundaries are supplied.</p></section><details class="model-direction neon-card"><summary><span class="model-icon">◇</span><b>Model's Direction</b><span id="direction-pills"></span></summary><div id="direction-details" class="direction-details"></div></details></section></main><script type="module" src="basketball.js"></script></body></html>
